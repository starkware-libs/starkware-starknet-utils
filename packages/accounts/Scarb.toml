[package]
name = "starkware_accounts"
readme = "README.md"
version.workspace = true
keywords.workspace = true
edition.workspace = true
description.workspace = true

[dependencies]
starknet.workspace = true
openzeppelin.workspace = true
starkware_utils = { path = "../utils" }

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true
starkware_utils_testing = { path = "../testing" }

[scripts]
test = "SNFORGE_BACKTRACE=1 snforge test"

[lib]

[[target.starknet-contract]]

[[test]]
name = "starkware_accounts_unittest"
build-external-contracts = ["starkware_utils::erc20::erc20_mocks::DualCaseERC20Mock"]

[tool]
fmt.workspace = true
scarb.workspace = true

[profile.dev.cairo]
unstable-add-statements-functions-debug-info = true
unstable-add-statements-code-locations-debug-info = true
inlining-strategy = "avoid"
panic-backtrace = true
