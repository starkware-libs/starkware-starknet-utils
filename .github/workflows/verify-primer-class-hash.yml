name: Verify Primer Class Hash

# The Primer contract (packages/primer, crate `contracts`) must keep its cemented on-chain
# class hash 0x00123e6b…, which is reproducible ONLY with scarb 2.14.0 + the release profile.
# This job is intentionally separate from the main 2.15.1 CI and pins the legacy toolchain.

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/primer/**"
      - ".github/workflows/verify-primer-class-hash.yml"

jobs:
  verify-primer-class-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/setup-snfoundry@bd5fc266ba0ce7e352b01dd7eaacc0fbb6145d17 # v3
        with:
          starknet-foundry-version: "0.54.1"
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1
        with:
          scarb-version: "2.14.0"

      - name: Verify Primer class hash (scarb 2.14.0, release profile)
        working-directory: packages/primer
        run: ./scripts/verify_primer_class_hash.sh
